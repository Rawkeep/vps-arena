name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Untergrenze und aktuelle Version — requires-python ist >=3.9,
        # das muss auch geprüft werden, nicht nur behauptet.
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Abhängigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Formatierung
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Typen
        run: mypy
      - name: Tests
        run: python -m pytest -q
